[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "practo-domain-support-agent"
version = "0.1.0"
description = "Synthetic Practo healthcare support-agent capstone"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "autogen-agentchat>=0.4,<0.8",
  "autogen-ext>=0.4,<0.8",
  "chromadb>=0.5,<2",
  "crewai>=0.80,<2",
  "fastapi>=0.115,<1",
  "langchain-core>=0.3,<2",
  "pydantic>=2.9,<3",
  "sentence-transformers>=3.2,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[project.scripts]
practo-dataset = "practo_support.dataset:main"
practo-ingest = "practo_support.knowledge:main"
practo-evaluate = "practo_support.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
